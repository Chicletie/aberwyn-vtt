<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palco · aberwyn-vtt</title>
    <link rel="stylesheet" href="/src/estilos/fontes.css" />
    <link rel="stylesheet" href="/src/estilos/palco.css" />
    <link rel="stylesheet" href="/src/estilos/palco-pagina.css" />
  </head>
  <body class="pixel">
    <!-- O "suporte" só posiciona o palco no centro; quem amplia é o #palco (via zoom). -->
    <div id="suporte">
      <!-- O palco inteiro mora nesta caixa de 480×270 "pixels de pixel art".
           Tudo dentro dele é criado pelo src/palco/palco.js. -->
      <div id="palco">
        <p id="debug" class="t-rotulo" hidden></p>
        <!-- Aparece só se a conexão com o servidor cair (modo online). -->
        <p id="reconectando" class="t-rotulo" hidden>RECONECTANDO…</p>
      </div>
    </div>
    <!-- Tela "Gire o celular" (só aparece com o celular em pé). Montada por src/palco/gire.js. -->
    <div id="gire" hidden></div>
    <script type="module" src="/src/palco/main.js"></script>
  </body>
</html>
